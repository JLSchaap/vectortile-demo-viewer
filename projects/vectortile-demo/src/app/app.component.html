<div>
  <div class="app-container">
    <div class="head">
      <img class="logo" alt="PDOK" src="assets/images/logo-pdok.svg" />
    </div>
    <div>
      <app-search></app-search>
    </div>
    <div class="vispanel">
      <button mat-button class="visbutton" type="button" (click)="toggleShow()" [attr.aria-expanded]="isShow" aria-controls="visualisatie-menu" data-testid="visualisatie-toggle">
        {{ currentVis }}
      </button>

      <div *ngIf="isShow" id="visualisatie-menu" class="visualisatie-menu" role="dialog" aria-label="Visualisaties" data-testid="visualisatie-menu">
        <label class="search-label" for="visualisatie-search">Zoek visualisatie</label>
        <input
          id="visualisatie-search"
          class="search-input"
          type="search"
          [(ngModel)]="searchTerm"
          placeholder="Zoek op naam"
          autocomplete="off"
          data-testid="visualisatie-search"
        />

        <div class="category-list" role="tablist" aria-label="Filter op bron">
          <button
            *ngFor="let category of categories"
            type="button"
            class="category-button"
            [class.active]="activeCategory === category"
            (click)="selectCategory(category)"
            role="tab"
            [attr.aria-selected]="activeCategory === category"
            [attr.aria-controls]="'visualisaties-' + category"
            [attr.data-testid]="'category-' + category"
          >{{ category }}</button>
        </div>

        <div *ngIf="recentOptions.length > 0" class="option-section">
          <h2>Recent gekozen</h2>
          <div *ngFor="let option of recentOptions; trackBy: trackByVisualisatie" class="option-row">
            <button mat-button type="button" class="lbutton" (click)="onSelect(option.visualisatie)">{{ option.title }}</button>
          </div>
        </div>

        <ng-container *ngFor="let group of groupedVisualisaties">
          <div class="option-section" [id]="'visualisaties-' + group.category">
            <h2>{{ group.category }}</h2>
            <div *ngFor="let option of group.options; trackBy: trackByVisualisatie" class="option-row">
              <button mat-button type="button" class="lbutton" (click)="onSelect(option.visualisatie)" [attr.data-testid]="'visualisatie-' + option.visualisatie">
                {{ option.title }}
              </button>
            </div>
          </div>
        </ng-container>

        <p *ngIf="filteredVisualisaties.length === 0" class="empty-state">Geen visualisaties gevonden.</p>
      </div>
    </div>

    <app-olmap
      class="maparea"
      [visualisation]="currentVis"
      (titelEmit)="receiveTitle($event)"
    >
    </app-olmap>
    <div class="foot">
      <app-location></app-location>
      <div class="stylelink">
        <app-showlink [url]="styleurl"></app-showlink>
      </div>

      <div class="gitlink">
        <a
          href="https://github.com/PDOK/vectortile-demo-viewer"
          target="_blank"
          rel="noopener noreferrer"
          >Code on Github</a
        >
      </div>
    </div>
  </div>
</div>
